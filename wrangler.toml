name = "awe-ai-workforce"
main = "src/index.ts"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[triggers]
crons = ["*/1 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "awe-workforce"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
ADMIN_GITHUB_LOGIN = "araratavetisyan777999"
APP_URL = "https://YOUR-PROJECT.pages.dev"
GITHUB_CALLBACK_URL = "https://YOUR-PROJECT.pages.dev/api/auth/callback"
MAX_TASK_ATTEMPTS = "3"
MAX_ACTIVE_TASKS = "5"
